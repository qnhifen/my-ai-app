<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>超级大乐透AI预测大师</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
      body {
        background-color: #f3f4f6; /* gray-100 */
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      }

      /* Print Styles */
      @media print {
        @page {
          margin: 0.5cm;
          size: auto;
        }

        /* Hide non-printable elements */
        .no-print, header, nav, button {
          display: none !important;
        }

        /* Reset layout */
        body, #root, main {
          background-color: white !important;
          color: black !important;
          margin: 0 !important;
          padding: 0 !important;
          width: 100% !important;
          height: auto !important;
          overflow: visible !important;
        }

        /* Prediction Report Styling */
        #prediction-report {
          display: block !important;
          position: relative !important;
          background: white !important;
          color: black !important;
          border: 2px solid #000 !important;
          border-radius: 8px !important;
          box-shadow: none !important;
          padding: 20px !important;
          margin: 0 !important;
          page-break-inside: avoid;
        }

        /* Force Text Colors to Black/Dark Gray */
        #prediction-report h2,
        #prediction-report h3,
        #prediction-report h4,
        #prediction-report p,
        #prediction-report span,
        #prediction-report div:not(.rounded-full) {
          color: black !important;
          background-image: none !important;
          -webkit-text-fill-color: black !important;
          text-shadow: none !important;
        }

        /* Reset Section Containers */
        #prediction-report .bg-slate-800\/50,
        #prediction-report .bg-white\/5,
        #prediction-report .bg-white\/10 {
          background-color: transparent !important;
          border: 1px solid #ccc !important;
        }

        /* Handle Watermarks and Decorators */
        #prediction-report .absolute {
          display: none !important;
        }

        /* Keep Lotto Balls Colored */
        #prediction-report .rounded-full {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
          border: 1px solid #ccc !important;
          color: white !important; /* Keep numbers white */
        }
        
        /* Adjust Ball Text Color if background fails to print */
        #prediction-report .rounded-full span {
             color: white !important; 
        }

        /* Header info in print */
        #prediction-report .bg-yellow-500\/20 {
            border: 1px solid #000 !important;
            background: none !important;
        }
      }
    </style>
